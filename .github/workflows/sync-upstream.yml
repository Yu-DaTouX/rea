name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/morluto/rea.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: Merge upstream into main
    # Only the fork runs this; the upstream repository has nothing to sync.
    if: github.repository != 'morluto/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date."
            exit 0
          fi
          # A conflict fails the job so it is visible; history is never rewritten.
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          git push origin HEAD:main
